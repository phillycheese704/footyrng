dEventListener('online', checkCache);\n        window.addEventListener('offline', checkCache);\n      }).catch(() => {\n        update('Offline installation failed. Stay online and try reloading, or download the HTML.');\n      });\n    }\n    initOfflinePlay();\n\n    window.addEventListener(\"pagehide\", () => saveState());");
